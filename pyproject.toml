[project]
name = "cybergraph"
version = "0.1.0"
description = "AI-Driven Cyber Threat Intelligence and Knowledge Graph Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "almina-nur"}]

dependencies = [
    "pydantic>=2.5",
    "pandas>=2.0",
    "requests>=2.31",
    "neo4j>=5.14",
    "spacy>=3.7",
    "scikit-learn>=1.3",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "streamlit>=1.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1", "mypy>=1.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]